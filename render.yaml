# Render Blueprint for the ValGrow API (NestJS + Prisma).
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → pick this repo.
# See docs/deploy-render.md for the complete Vercel + Render setup guide.
services:
  - type: web
    name: valgrow-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build --workspace=apps/api
    # The schema is ahead of the committed migrations, so sync it on start.
    # `db push` refuses destructive changes, so a risky schema change fails loudly instead of losing data.
    startCommand: npx prisma db push --skip-generate && node apps/api/dist/src/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false # Postgres URL (Neon, Supabase, Render Postgres, or Coolify)
      - key: WEB_URL
        sync: false # Your Vercel URL, e.g. https://valgrow-business-os-t6x9-nine.vercel.app (used for CORS)
      - key: COOKIE_SAME_SITE
        value: lax
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
