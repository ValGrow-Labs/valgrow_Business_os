services:
  postgres:
    image: postgres:16-alpine
    container_name: valgrow_postgres
    restart: always
    environment:
      POSTGRES_DB: valgrow_db
      POSTGRES_USER: valgrow
      POSTGRES_PASSWORD: valgrow_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valgrow -d valgrow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
